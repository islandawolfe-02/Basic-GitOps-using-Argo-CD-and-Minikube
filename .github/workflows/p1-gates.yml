# P1 gates: the hosted equivalent of the W1.07 packaging gate and the submit.sh refusals.
# CI never deploys: minikube runs on your Mac, and Argo CD there syncs the reviewed revision from GitHub.
# The CI image is a separate (amd64) build; deploy only the image you built and checked on the Mac.
name: p1-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash   # adds -o pipefail, so `| tee` cannot hide a failing check

jobs:
  package:
    name: Package gate (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f Containerfile -t "ci/foundation:${GITHUB_SHA}" .
      - name: Record image identity
        run: |
          echo "Source commit: ${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CI image ID (amd64, not the deployed image): $(docker image inspect "ci/foundation:${GITHUB_SHA}" --format '{{.Id}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run container
        run: docker run -d --name foundation -p 127.0.0.1:18080:8080 --env-file runtime.env -e LAB_SESSION="ci-${GITHUB_RUN_ID}" "ci/foundation:${GITHUB_SHA}"
      - name: Smoke checks
        run: |
          mkdir -p smoke-evidence
          bash scripts/smoke.sh http://127.0.0.1:18080 "$(sed -n 's/^LAB_ENV=//p' runtime.env)" smoke-evidence | tee smoke-evidence/result.txt
      - name: Container log
        if: always()
        run: mkdir -p smoke-evidence && docker logs foundation 2>&1 | tee smoke-evidence/container.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-evidence
          path: smoke-evidence/

  configuration:
    name: Configuration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check configuration/app/resources.yaml and client.json
        run: bash scripts/check-config.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
